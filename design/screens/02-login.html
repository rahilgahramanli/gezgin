<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEZGIN — 02 Daxil ol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../gezgin.css">
<script src="../icons.js" defer></script>
</head>
<body class="canvas">
<div class="device"><div class="phone">

  <div class="statusbar light overlay">
    <span>9:41</span>
    <span class="icons"><svg class="i"><use href="#i-signal"/></svg><svg class="i"><use href="#i-wifi"/></svg><svg class="i" style="width:26px"><use href="#i-battery"/></svg></span>
  </div>
  <div class="topbar overlay light">
    <a class="icon-btn glass"><svg class="i"><use href="#i-back"/></svg></a>
  </div>

  <main class="screen" style="display:flex;flex-direction:column">
    <div class="hero" style="height:160px">
      <img src="../assets/hero-woman-lake.jpg" alt="" style="object-position:center 30%">
      <div class="shade"></div>
    </div>

    <div class="sheet-top" style="flex:1;display:flex;flex-direction:column">
      <div class="handle"></div>
      <div class="px" style="flex:1;display:flex;flex-direction:column;padding-bottom:36px">
        <h1 class="title-xl">Xoş gəldin!</h1>
        <p class="meta mt-8" style="font-size:14px">Hesabına daxil ol və səyahətinə davam et</p>

        <div class="col gap-16 mt-24">
          <div class="field">
            <label>E-mail və ya telefon</label>
            <div class="input"><svg class="i"><use href="#i-mail"/></svg><input placeholder="aysel@gezgin.app"></div>
          </div>
          <div class="field">
            <label>Şifrə</label>
            <div class="input"><svg class="i"><use href="#i-lock"/></svg><input type="password" value="••••••••••"><svg class="i"><use href="#i-eye"/></svg></div>
          </div>
        </div>
        <div class="row mt-12" style="justify-content:flex-end"><a class="small green semi">Şifrəni unutmusan?</a></div>

        <a class="btn btn-primary btn-block mt-20">Daxil ol</a>

        <div class="or mt-20">və ya</div>

        <div class="col gap-10 mt-20">
          <a class="social-btn"><svg class="i"><use href="#i-google"/></svg> Google ilə davam et</a>
          <a class="social-btn"><svg class="i" style="color:#000"><use href="#i-apple"/></svg> Apple ilə davam et</a>
        </div>

        <p class="center meta" style="margin-top:auto;padding-top:24px;font-size:14px">Hesabın yoxdur? <b class="green">Qeydiyyatdan keç</b></p>
      </div>
    </div>
  </main>

  <div class="home-indicator"></div>
</div></div>
</body>
</html>
