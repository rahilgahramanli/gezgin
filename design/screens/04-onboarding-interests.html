<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEZGIN — 04 Profilini tamamla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../gezgin.css">
<script src="../icons.js" defer></script>
<style>
  .option-card { padding: 12px; gap: 10px; min-width: 0; font-weight: 600; font-size: 14px; }
  .option-card .ic { width: 36px; height: 36px; border-radius: 12px; background: var(--green-100); color: var(--green-900); display: grid; place-items: center; flex: none; }
  .option-card.selected .ic { background: var(--green-900); color: #fff; }
</style>
</head>
<body class="canvas">
<div class="device"><div class="phone">

  <div class="statusbar">
    <span>9:41</span>
    <span class="icons"><svg class="i"><use href="#i-signal"/></svg><svg class="i"><use href="#i-wifi"/></svg><svg class="i" style="width:26px"><use href="#i-battery"/></svg></span>
  </div>
  <div class="topbar">
    <a class="icon-btn"><svg class="i"><use href="#i-back"/></svg></a>
    <a class="muted semi" style="font-size:15px;padding:0 4px">Keç</a>
  </div>

  <main class="screen">
    <div class="content" style="padding-bottom:120px">
      <span class="pill">Addım 2 / 3</span>
      <h1 class="title-xl mt-12">Səni nə maraqlandırır?</h1>
      <p class="meta mt-8" style="font-size:14px">Tövsiyələri sənin zövqünə görə hazırlayaq</p>

      <div class="grid-2 mt-20">
        <a class="option-card selected"><span class="ic"><svg class="i"><use href="#i-tree"/></svg></span>Təbiət</a>
        <a class="option-card"><span class="ic"><svg class="i"><use href="#i-landmark"/></svg></span>Tarix</a>
        <a class="option-card"><span class="ic"><svg class="i"><use href="#i-flag"/></svg></span>Mədəniyyət</a>
        <a class="option-card selected"><span class="ic"><svg class="i"><use href="#i-tent"/></svg></span>Macəra</a>
        <a class="option-card selected"><span class="ic"><svg class="i"><use href="#i-utensils"/></svg></span>Qastronomiya</a>
        <a class="option-card"><span class="ic"><svg class="i"><use href="#i-camera"/></svg></span>Foto</a>
        <a class="option-card"><span class="ic"><svg class="i"><use href="#i-sparkle"/></svg></span>Festival</a>
        <a class="option-card"><span class="ic"><svg class="i"><use href="#i-fire"/></svg></span>Kəmpinq</a>
        <a class="option-card"><span class="ic"><svg class="i"><use href="#i-sun"/></svg></span>Dəniz</a>
        <a class="option-card"><span class="ic"><svg class="i"><use href="#i-mountain"/></svg></span>Dağ</a>
      </div>

      <section class="section">
        <div class="section-head" style="margin-bottom:4px"><h2 class="h2">Ev regionun</h2></div>
        <p class="meta mb-12">Yaxınlıqdakı tədbirlər və yerli tövsiyələr üçün</p>
        <div class="chips">
          <a class="chip">Bakı</a>
          <a class="chip active"><svg class="i xs"><use href="#i-pin"/></svg>Quba</a>
          <a class="chip">Qəbələ</a>
          <a class="chip">Şəki</a>
          <a class="chip">Gəncə</a>
          <a class="chip">Lənkəran</a>
        </div>
      </section>
    </div>
  </main>

  <div class="bottom-cta">
    <a class="btn btn-primary btn-block">Davam et (3 seçildi)</a>
  </div>
  <div class="home-indicator"></div>
</div></div>
</body>
</html>
