<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEZGIN — 37 Şifrəni bərpa et</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../gezgin.css">
<script src="../icons.js" defer></script>
</head>
<body class="canvas">
<div class="device"><div class="phone">

  <div class="statusbar">
    <span>9:41</span>
    <span class="icons"><svg class="i"><use href="#i-signal"/></svg><svg class="i"><use href="#i-wifi"/></svg><svg class="i" style="width:26px"><use href="#i-battery"/></svg></span>
  </div>
  <div class="topbar">
    <a class="icon-btn"><svg class="i"><use href="#i-back"/></svg></a>
    <div class="ttl">Şifrəni bərpa et</div>
  </div>

  <main class="screen" style="display:flex;flex-direction:column">
    <div class="content" style="flex:1;display:flex;flex-direction:column;justify-content:space-between;padding-bottom:36px">
      <div>
        <div style="width:72px;height:72px;border-radius:50%;background:var(--green-100);color:var(--green-900);display:grid;place-items:center;margin:20px auto 0"><svg class="i lg"><use href="#i-lock"/></svg></div>
        <h1 class="title-lg center mt-20">Şifrəni unutmusan?</h1>
        <p class="meta center mt-8" style="font-size:14px;padding:0 16px">E-mail və ya telefon nömrəni yaz, sənə təsdiq kodu göndərək.</p>

        <div class="segment box mt-24">
          <a class="seg active">E-mail</a>
          <a class="seg">Telefon</a>
        </div>

        <div class="field mt-20">
          <label>E-mail</label>
          <div class="input focus"><svg class="i"><use href="#i-mail"/></svg><input value="aysel@gezgin.app"></div>
        </div>

        <a class="btn btn-primary btn-block mt-20">Kod göndər</a>

        <div class="notice mt-16">
          <svg class="i sm" style="margin-top:1px"><use href="#i-info"/></svg>
          <span>Kod 10 dəqiqə ərzində etibarlıdır. Spam qovluğunu da yoxla.</span>
        </div>
      </div>

      <p class="center meta" style="font-size:14px;padding-top:24px"><b class="green">Daxil ol</b> səhifəsinə qayıt</p>
    </div>
  </main>

  <div class="home-indicator"></div>
</div></div>
</body>
</html>
