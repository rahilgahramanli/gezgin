<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEZGIN — 46 Fotolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../gezgin.css">
<script src="../icons.js" defer></script>
<style>
  .segment.glass { width: 100%; }
  .segment.glass .seg { flex: 1; justify-content: center; padding: 0 10px; font-size: 13px; background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.2); color: #fff; }
  .segment.glass .seg .n { opacity: .7; margin-left: 5px; font-weight: 400; }
  .segment.glass .seg.active { background: #fff; color: #0F1514; border-color: #fff; }
  .segment.glass .seg.active .n { opacity: .55; }
  .masonry { display: flex; gap: 6px; align-items: flex-start; }
  .masonry .colm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .masonry .photo-card { border-radius: 12px; width: 100%; }
  .masonry .photo-card .ov { padding: 10px; background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(10,20,20,.7) 100%); }
  .masonry .photo-card .who { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: #fff; }
  .masonry .photo-card .who .avatar { border: 1.5px solid rgba(255,255,255,.8); }
</style>
</head>
<body class="canvas">
<div class="device"><div class="phone" style="background:#0F1514">

  <div class="statusbar light">
    <span>9:41</span>
    <span class="icons"><svg class="i"><use href="#i-signal"/></svg><svg class="i"><use href="#i-wifi"/></svg><svg class="i" style="width:26px"><use href="#i-battery"/></svg></span>
  </div>
  <div class="topbar light">
    <a class="icon-btn glass"><svg class="i"><use href="#i-back"/></svg></a>
    <div class="ttl">Xınalıq kəndi · 248 foto</div>
    <a class="icon-btn glass"><svg class="i"><use href="#i-grid"/></svg></a>
  </div>

  <main class="screen" style="padding-bottom:96px">
    <div class="content" style="padding-top:4px">
      <div class="segment glass">
        <a class="seg active">Hamısı<span class="n">248</span></a>
        <a class="seg">Gezginlərdən<span class="n">190</span></a>
        <a class="seg">Rəsmi<span class="n">58</span></a>
      </div>

      <div class="masonry mt-12">
        <div class="colm">
          <a class="photo-card" style="height:150px">
            <img src="../assets/place-xinaliq.jpg" alt="">
            <div class="ov"><div class="who"><span class="avatar xs"><img src="../assets/avatar-sen.jpg" alt=""></span>aysel.go</div></div>
          </a>
          <a class="photo-card" style="height:200px">
            <img src="../assets/post-aysel-village.jpg" alt="">
            <span class="pill glass top-right"><svg class="i"><use href="#i-heart"/></svg> 1.2K</span>
            <div class="ov"><div class="who"><span class="avatar xs"><img src="../assets/avatar-sen.jpg" alt=""></span>aysel.go</div></div>
          </a>
          <a class="photo-card" style="height:120px">
            <img src="../assets/thumb-quba-forest.jpg" alt="">
            <div class="ov"><div class="who"><span class="avatar xs"><img src="../assets/avatar-gulnar.jpg" alt=""></span>gulnar.k</div></div>
          </a>
          <a class="photo-card" style="height:160px">
            <img src="../assets/card-lake.jpg" alt="">
            <div class="ov"><div class="who"><span class="avatar xs"><img src="../assets/avatar-lale.jpg" alt=""></span>lale.travel</div></div>
          </a>
        </div>
        <div class="colm">
          <a class="photo-card" style="height:120px">
            <img src="../assets/xinaliq-panorama.jpg" alt="">
            <div class="ov"><div class="who"><span class="avatar xs"><img src="../assets/avatar-rustem.jpg" alt=""></span>rustem.q</div></div>
          </a>
          <a class="photo-card" style="height:200px">
            <img src="../assets/exp-dag-yurushu.jpg" alt="">
            <div class="ov"><div class="who"><span class="avatar xs"><img src="../assets/avatar-tural.jpg" alt=""></span>tural.travels</div></div>
          </a>
          <a class="photo-card" style="height:150px">
            <img src="../assets/valley-vertical.jpg" alt="">
            <div class="ov"><div class="who"><span class="avatar xs"><img src="../assets/avatar-leriman.jpg" alt=""></span>leriman.m</div></div>
          </a>
          <a class="photo-card" style="height:160px">
            <img src="../assets/place-lahic.jpg" alt="">
            <div class="ov"><div class="who"><span class="avatar xs"><img src="../assets/avatar-tural.jpg" alt=""></span>tural.travels</div></div>
          </a>
        </div>
      </div>
    </div>
  </main>

  <div class="bottom-cta" style="background:linear-gradient(180deg,rgba(15,21,20,0),#0F1514 30%)">
    <a class="btn btn-light btn-block"><svg class="i sm"><use href="#i-camera"/></svg> Foto əlavə et · +300 XP</a>
  </div>
  <div class="home-indicator light"></div>
</div></div>
</body>
</html>
