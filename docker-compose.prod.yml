# GEZGIN — produksiya dəsti (tək server, 1 GB RAM).
#
# Yaddaş dar olduğu üçün hər xidmətə limit qoyulub və MySQL kiçildilib;
# 2 GB swap şərtdir (bax: DEPLOY.md). Heç bir xidmət host portuna çıxmır —
# yeganə giriş nöqtəsi nginx-dir (80).
name: gezgin

services:
  mysql:
    image: mysql:8.4
    container_name: gezgin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gezgin}
      MYSQL_USER: ${MYSQL_USER:-gezgin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+00:00
      --max-connections=60
      --innodb-buffer-pool-size=128M
      --innodb-log-buffer-size=8M
      --performance-schema=OFF
      --table-open-cache=200
      --tmp-table-size=16M
      --max-heap-table-size=16M
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { memory: 420M }

  redis:
    image: redis:7-alpine
    container_name: gezgin-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 96M }

  minio:
    image: quay.io/minio/minio:latest
    container_name: gezgin-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 256M }

  # Bucket-i bir dəfə yaradır; `up -d` ilə hər dəfə işə düşməsin deyə profildədir:
  #   docker compose --profile init up minio-init
  minio-init:
    profiles: [init]
    image: quay.io/minio/mc:latest
    container_name: gezgin-minio-init
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc mb --ignore-existing local/${S3_BUCKET:-gezgin};
      mc anonymous set download local/${S3_BUCKET:-gezgin};
      echo 'bucket hazırdır';
      "
    restart: "no"

  # OTP və bildiriş e-poçtları — real provayder seçilənə qədər burada dayanır.
  # Host portuna çıxmır; baxmaq üçün: ssh -L 8025:localhost:8025
  mail:
    # Mailpit — MailHog-un davamı; image 30 MB (MailHog 572 MB idi, diskdə yer dar)
    image: axllent/mailpit:latest
    container_name: gezgin-mail
    restart: unless-stopped
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:8025:8025"
    deploy:
      resources:
        limits: { memory: 64M }

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
    image: gezgin-api:prod
    container_name: gezgin-api
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      APP_ROLE: api
      # Prisma hovuzu defoltda `CPU*2+1`-dir; konteyner 1 CPU gördüyü üçün cəmi 3
      # bağlantı açılırdı və bir neçə paralel sorğu hovuzu tükəndirirdi.
      DATABASE_URL: mysql://${MYSQL_USER:-gezgin}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-gezgin}?connection_limit=12&pool_timeout=20&connect_timeout=10
      REDIS_HOST: redis
      MAIL_HOST: mail
      MAIL_PORT: 1025
    env_file: [.env.production]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits: { memory: 320M }

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      target: production
    image: gezgin-admin:prod
    container_name: gezgin-admin
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }
    environment:
      NODE_ENV: production
      # Panel API-yə daxili şəbəkədən müraciət edir — nginx-ə ehtiyac yoxdur
      GEZGIN_API_URL: http://api:3000/api/v1
    deploy:
      resources:
        limits: { memory: 256M }

  nginx:
    image: nginx:1.27-alpine
    container_name: gezgin-nginx
    restart: unless-stopped
    # Upstream-lər Docker DNS-i ilə tənbəl həll olunur (bax: nginx konfiqi),
    # ona görə asılılıq tələb olunmur: api və ya admin düşəndə nginx işləməyə
    # davam edir və yalnız həmin yol 502 qaytarır.
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/gezgin.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits: { memory: 64M }

volumes:
  mysql_data:
  redis_data:
  minio_data:
