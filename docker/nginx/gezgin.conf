# GEZGIN — tək giriş nöqtəsi (port 80).
#   /            → admin paneli
#   /api/v1/     → NestJS API
#   /docs        → Swagger
#   /socket.io/  → WebSocket (socket.io; `/ws` namespace-i də bu yoldan keçir)
#   /gezgin/     → MinIO public bucket (presign yolu dəyişmir)

server {
    listen 80 default_server;
    server_name _;

    # Docker-in daxili DNS-i. Upstream adları dəyişənlə işlədilir ki, konteyner
    # yenidən başlayanda nginx "host not found" ilə yıxılmasın.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 110M;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/ {
        set $api http://api:3000;
        proxy_pass $api;
    }

    location /docs {
        set $api_docs http://api:3000;
        proxy_pass $api_docs;
    }

    location /docs-json {
        set $api_json http://api:3000;
        proxy_pass $api_json;
    }

    # `/ws` socket.io NAMESPACE-idir; HTTP əl sıxması həmişə `/socket.io/`
    # yoluna gedir — proxy də məhz onu ötürməlidir.
    location /socket.io/ {
        set $api_ws http://api:3000;
        proxy_pass $api_ws;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Presign imzası HƏM host, HƏM yol üzərindən hesablanır — bucket adı public
    # prefiksdir və yol dəyişdirilmir, əks halda MinIO 403 qaytarır.
    location /gezgin/ {
        set $minio http://minio:9000;
        proxy_pass $minio;
        proxy_buffering off;
    }

    location / {
        set $admin http://admin:3200;
        proxy_pass $admin;
    }
}
